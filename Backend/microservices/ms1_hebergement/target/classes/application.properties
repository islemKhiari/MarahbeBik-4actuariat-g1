spring.application.name=ms1-hebergement

server.port=8082

# Config Server : optionnel (le service d�marre m�me s'il n'y en a pas)
spring.config.import=optional:configserver:

#DataSource - MySQL
spring.datasource.url=jdbc:mysql://localhost:3307/hebergement_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#JPA
# Hibernate cr�e et met � jour les tables � partir des entit�s
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

#Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

#Eureka
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true


#Actuator
# Exposer les endpoints health, info et metrics (seul health l'est par d�faut)
management.endpoints.web.exposure.include=health,info,metrics
# Afficher le d�tail des composants dans /health (db, diskSpace, ping...)
management.endpoint.health.show-details=always
# Transmettre � Eureka le statut de /health (MS1 passe DOWN si la base tombe)
eureka.client.healthcheck.enabled=true
# Publier les propri�t�s info.* dans /actuator/info (d�sactiv� par d�faut)
management.info.env.enabled=true
# Contenu affich� par /actuator/info
info.app.name=ms1-hebergement
info.app.version=1.0.0
info.app.description=Microservice de gestion des maisons d'hotes, chambres et equipements


management.health.rabbit.enabled=false

eureka.instance.ip-address=127.0.0.1