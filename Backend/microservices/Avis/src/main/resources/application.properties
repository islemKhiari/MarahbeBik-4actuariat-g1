spring.application.name=Avis
server.port=8085

# DataSource - MySQL (base dédiée avis_db)
spring.datasource.url=jdbc:mysql://localhost:3306/avis_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Eureka Client
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true


# 1. Exposer les endpoints demandés par le TP (health, info, metrics, et loggers si besoin)
management.endpoints.web.exposure.include=health,info,metrics,loggers

# 2. Afficher le détail des composants dans /actuator/health (db, diskSpace, ping...)
management.endpoint.health.show-details=always

# 3. TRÈS IMPORTANT : Transmettre le vrai statut de /actuator/health à Eureka
# (Permet à AVIS de passer DOWN dans Eureka si MySQL s'arrête)
eureka.client.healthcheck.enabled=true

# 4. Activer et personnaliser l'endpoint /actuator/info (affiché quand on clique sur AVIS dans Eureka)
management.info.env.enabled=true
info.app.name=avis
info.app.version=1.0.0
info.app.description=Microservice de gestion des avis et signalements - MarahbeBik
info.app.team=4Actuariat-G1