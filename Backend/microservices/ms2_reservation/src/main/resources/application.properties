spring.application.name=ms2-reservation

server.port=8084

# Config Server : optionnel
spring.config.import=optional:configserver:

# DataSource - PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/reservation_db
spring.datasource.username=postgres
spring.datasource.password=010203
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Eureka
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Eureka Health Check
eureka.client.healthcheck.enabled=true

# Info endpoint
management.info.env.enabled=true
info.app.name=ms2-reservation
info.app.version=1.0.0
info.app.description=Microservice de gestion des reservations de sejour

# RabbitMQ Health
management.health.rabbit.enabled=false
