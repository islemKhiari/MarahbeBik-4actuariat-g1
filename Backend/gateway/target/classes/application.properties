spring.application.name=gateway
server.port=8089

# Configuration Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1

# ==========================================
# MS4 - AVIS
# ==========================================
spring.cloud.gateway.server.webmvc.routes[0].id=AVIS
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://AVIS
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/avis/**

# Circuit Breaker AVIS
spring.cloud.gateway.server.webmvc.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[0].filters[0].args.id=avisCB
spring.cloud.gateway.server.webmvc.routes[0].filters[0].args.fallbackUri=forward:/fallback/avis
spring.cloud.gateway.server.webmvc.routes[0].filters[0].args.statusCodes=500,502,503,504

# ==========================================
# MS3 - PRESTATIONS
# ==========================================
spring.cloud.gateway.server.webmvc.routes[1].id=PRESTATIONS
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://PRESTATIONS
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/prestations/**,/api/reservations-prestations/**

# Circuit Breaker PRESTATIONS
spring.cloud.gateway.server.webmvc.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[1].filters[0].args.id=prestationsCB
spring.cloud.gateway.server.webmvc.routes[1].filters[0].args.fallbackUri=forward:/fallback/prestations
spring.cloud.gateway.server.webmvc.routes[1].filters[0].args.statusCodes=500,502,503,504

# ==========================================
# MS2 - RESERVATION
# ==========================================
spring.cloud.gateway.server.webmvc.routes[2].id=MS2-RESERVATION
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://MS2-RESERVATION
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/reservations/**

# Circuit Breaker RESERVATION
spring.cloud.gateway.server.webmvc.routes[2].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[2].filters[0].args.id=reservationCB
spring.cloud.gateway.server.webmvc.routes[2].filters[0].args.fallbackUri=forward:/fallback/reservation
spring.cloud.gateway.server.webmvc.routes[2].filters[0].args.statusCodes=500,502,503,504

# ==========================================
# MS5 - RECOMMANDATION
# ==========================================
spring.cloud.gateway.server.webmvc.routes[3].id=RECOMMANDATION
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://RECOMMANDATION
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/recommandations/**,/api/preferences/**

# Circuit Breaker RECOMMANDATION
spring.cloud.gateway.server.webmvc.routes[3].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[3].filters[0].args.id=recommandationCB
spring.cloud.gateway.server.webmvc.routes[3].filters[0].args.fallbackUri=forward:/fallback/recommandation
spring.cloud.gateway.server.webmvc.routes[3].filters[0].args.statusCodes=500,502,503,504

# ==========================================
# MS1 - HEBERGEMENT
# ==========================================
spring.cloud.gateway.server.webmvc.routes[4].id=ms1-hebergement
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://MS1-HEBERGEMENT
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/maisons/**,/api/chambres/**,/api/equipements/**

# Circuit Breaker HEBERGEMENT
spring.cloud.gateway.server.webmvc.routes[4].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[4].filters[0].args.id=hebergementCB
spring.cloud.gateway.server.webmvc.routes[4].filters[0].args.fallbackUri=forward:/fallback/hebergement
spring.cloud.gateway.server.webmvc.routes[4].filters[0].args.statusCodes=500,502,503,504

# ==========================================
# Configuration commune Resilience4j
# ==========================================
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=4
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=4
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=2

# Configuration des cinq Circuit Breakers
resilience4j.circuitbreaker.instances.avisCB.base-config=default
resilience4j.circuitbreaker.instances.prestationsCB.base-config=default
resilience4j.circuitbreaker.instances.reservationCB.base-config=default
resilience4j.circuitbreaker.instances.recommandationCB.base-config=default
resilience4j.circuitbreaker.instances.hebergementCB.base-config=default

# Timeout commun
resilience4j.timelimiter.configs.default.timeout-duration=3s

# ==========================================
# Logs
# ==========================================
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.cloud.loadbalancer=DEBUG
logging.level.io.github.resilience4j=DEBUG
logging.level.io.github.resilience4j.circuitbreaker=DEBUG